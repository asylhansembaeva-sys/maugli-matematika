<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Маугли — математикалық саяхат</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Times New Roman',serif;font-weight:900;background:#092b22}button{font-family:inherit;font-weight:900;cursor:pointer}#game{max-width:1600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:url("forest_scene.jpg") center/cover no-repeat}.top{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,3fr) minmax(110px,1fr);gap:10px;padding:10px;background:transparent}.panel,.eq,.ans{background:linear-gradient(#fffce5,#f7dba1);border:5px ridge #9d5c20;box-shadow:0 4px 6px #0007;border-radius:18px;text-align:center;color:#0c1713}.panel{display:flex;flex-direction:column;justify-content:center;font-size:clamp(17px,2.2vw,32px);padding:4px}.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.ans{font-size:clamp(40px,6vw,90px);border:5px ridge #9d5c20;min-height:104px;color:#050505;text-shadow:1px 0 #000}.ans:disabled{cursor:default}.ans.ok{background:#fff1ac}.ans.no{background:#ffb3a6;animation:shake .35s}.equation{padding:7px 14%;background:transparent;text-align:center;z-index:4}.eq{display:flex;align-items:center;justify-content:center;padding:5px 12px;font-size:clamp(43px,7vw,92px);white-space:nowrap}.world{position:relative;flex:1;min-height:360px;overflow:hidden;background:linear-gradient(#163d1b22,#0a674622),url('forest_scene.jpg') center/cover no-repeat}.water{position:absolute;bottom:0;height:23%;width:100%;background:linear-gradient(#36d9d255,#006f8c88)}.track{position:absolute;inset:0;will-change:transform}.stump{position:absolute;bottom:-8%;width:22%;height:38%;border:5px solid #623314;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,#73370f 0 12px,#ad6428 13px 27px,#754018 28px 42px);box-shadow:inset 10px 0 #e9a85c88,7px 7px 8px #0006}.stump:before{content:'';position:absolute;top:-10%;left:-8%;width:116%;height:20%;border-radius:50%;border:5px solid #78451f;background:repeating-radial-gradient(ellipse,#efc790 0 8px,#a66d38 9px 12px,#d7a36b 13px 21px)}.stump:after{content:'🌿';position:absolute;top:3%;left:1%;font-size:22px}.hero{position:absolute;z-index:6;width:clamp(105px,16vw,230px);height:clamp(135px,21vw,290px);transform-origin:50% 93%;filter:drop-shadow(2px 5px 3px #0008);pointer-events:none;will-change:left,bottom,transform}.hero svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(1px 2px 1px #0006)}.arm-front,.arm-back,.leg-front,.leg-back,.hair{transform-box:fill-box;transform-origin:top center}.hero.prep .leg-front,.hero.landed .leg-front{transform:rotate(27deg)}.hero.prep .leg-back,.hero.landed .leg-back{transform:rotate(-22deg)}.hero.prep .arm-front,.hero.landed .arm-front{transform:rotate(37deg)}.hero.prep .arm-back,.hero.landed .arm-back{transform:rotate(-33deg)}.hero.flying .arm-front{animation:armfront .32s infinite alternate}.hero.flying .arm-back{animation:armback .35s infinite alternate}.hero.flying .leg-front{animation:legfront .35s infinite alternate}.hero.flying .leg-back{animation:legback .4s infinite alternate}.hero.flying svg{animation:floatboy .3s ease-in-out infinite alternate}.hero.flying .hair{animation:hair .18s infinite alternate}.hero.flying .arm-front,.hero.flying .arm-back{transform-origin:top center}.hero.landed svg{animation:landbreath 1.3s ease-in-out infinite alternate}@keyframes landbreath{to{transform:translateY(-2px)}}.hero.landed .arm-front,.hero.landed .arm-back{transition:transform .2s}@keyframes floatboy{from{transform:rotate(-7deg) scaleX(1.02)}to{transform:rotate(5deg) scaleX(.99)}}.notice{position:absolute;top:3%;width:100%;text-align:center;font-size:clamp(20px,3vw,39px);color:white;text-shadow:2px 3px 4px #123a1b;pointer-events:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;background:#16442ccc;color:white;font-size:clamp(14px,2vw,25px)}.bottom button{font-size:clamp(15px,2vw,24px);background:#ffe7a7;border:3px solid #8a5b1b;border-radius:12px;padding:7px}.modal{position:fixed;inset:0;z-index:10;background:#073e30e9;display:flex;justify-content:center;align-items:center;padding:15px}.modal.hidden{display:none}.dialog{max-width:700px;text-align:center;background:#fff5cb;border:7px ridge #9c6227;border-radius:24px;padding:25px}.dialog h1{font-size:clamp(33px,5vw,60px);color:#226d36}.dialog p{font-size:clamp(23px,3vw,38px)}.dialog button{background:#ffde59;border:5px solid #9c6227;border-radius:18px;font-size:clamp(25px,4vw,40px);padding:12px 22px}@keyframes armfront{to{transform:rotate(-28deg)}}@keyframes armback{to{transform:rotate(35deg)}}@keyframes legfront{to{transform:rotate(33deg)}}@keyframes legback{to{transform:rotate(-33deg)}}@keyframes hair{to{transform:skewY(-14deg) translateX(-4px)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-width:650px){.top{grid-template-columns:20% 60% 20%;gap:3px;padding:4px}.panel{font-size:clamp(12px,3vw,19px);border-width:2px;border-radius:8px}.answers{gap:3px}.ans{min-height:61px;font-size:clamp(31px,8vw,51px);border-width:2px;border-radius:9px}.equation{padding:5px 7%}.eq{font-size:clamp(30px,8vw,68px);padding:2px 6px;border-width:3px}.world{min-height:390px}.top{background:transparent}.equation{background:transparent}.stump{width:28%;height:32%}.hero{width:24%;height:31%}.bottom span{display:none}}
@media(max-height:700px){.world{min-height:280px}.hero{max-height:215px}}.answers .ans{background:#fff3d4!important;border-color:#b47732!important;color:#090909!important;font-family:'Times New Roman',serif!important;font-weight:900!important}.answers .ans.ok{background:#ffe18d!important}.answers .ans.no{background:#ffd0c5!important}

/* Фон бір рет қана салынады; есептің артында ешбір тақта не жасыл қабат жоқ. */
#game{background-image:url("forest_scene.jpg");background-size:cover;background-position:center;background-attachment:scroll}
.world{background:transparent!important}
.water{display:none!important}
.top,.equation{background:transparent!important}
#expression.eq{background:transparent!important;border:0!important;box-shadow:none!important;color:#071c7a!important;text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 4px 5px #0008!important}
#expression{min-width:0}
@media(max-width:650px){#expression.eq{font-size:clamp(34px,8vw,68px)}}
/* Өрнек жауаптар сияқты төртбұрышты ашық тақтайшада */
#expression.eq{background:linear-gradient(#fffce5,#f7dba1)!important;border:5px ridge #9d5c20!important;box-shadow:0 4px 6px #0007!important;border-radius:18px!important;color:#071c7a!important;text-shadow:none!important;min-width:0}
@media(max-width:650px){#expression.eq{border-width:2px!important;border-radius:9px!important}}

/* Телефондағы ықшам ойын алаңы: ағаштар мен Маугли бір көріністе. */
@media (max-width:650px) {
  html,body {min-height:100%;}
  #game {min-height:0!important; height:auto!important; background-position:center top!important;}
  .top {grid-template-columns:20% 60% 20%; gap:3px; padding:4px;}
  .panel {font-size:clamp(12px,3vw,18px); line-height:1.2;}
  .equation {padding:5px 5%;}
  .answers .ans {min-height:56px!important; font-size:clamp(30px,8vw,48px)!important;}
  .world {flex:none!important; min-height:0!important; height:clamp(290px,48svh,510px)!important; overflow:hidden;}
  .stump {height:35%!important; bottom:-8%!important; width:22%!important;}
  .hero {width:clamp(86px,22vw,145px)!important; height:clamp(114px,29vw,192px)!important;}
  .notice {font-size:clamp(18px,4vw,28px);}
  .bottom {padding:7px 5px; gap:4px;}
  .bottom button {font-size:clamp(12px,3.2vw,18px); padding:7px 4px;}
}
</style></head><body><main id="game"><header class="top"><div class="panel" id="progress">Тапсырма<br>1 / 20</div><div class="eq" id="expression">3 + 7 =</div><div class="panel" id="clock">⏱ Уақыт<br>00:00</div></header><div class="equation"><div class="answers" id="answers"></div></div><section class="world" id="world"><div class="water"></div><div class="track" id="track"></div><div class="hero prep" id="hero"><svg viewBox="0 0 170 220" xmlns="http://www.w3.org/2000/svg"><g class="leg-back"><path d="M75 144 Q59 167 48 193" stroke="#c77939" stroke-width="20" stroke-linecap="round" fill="none"/><ellipse cx="42" cy="198" rx="17" ry="8" fill="#e6a063"/></g><g class="arm-back"><path d="M69 91 Q37 111 26 137" stroke="#c5793e" stroke-width="16" stroke-linecap="round" fill="none"/><circle cx="24" cy="141" r="10" fill="#e5a05e"/></g><g class="leg-front"><path d="M91 143 Q116 167 112 190" stroke="#e9a060" stroke-width="21" stroke-linecap="round" fill="none"/><ellipse cx="120" cy="196" rx="18" ry="8" fill="#e9a060"/></g><path d="M65 89 Q95 74 105 102 L97 147 Q83 159 67 145Z" fill="#db8a4c" stroke="#a85a2e" stroke-width="2"/><path d="M65 134 L102 129 L109 158 Q84 171 57 153Z" fill="#82421c" stroke="#4e2c16" stroke-width="3"/><path d="M65 143 l-14 15 m29 -10 l-5 18 m26 -20 l15 13" stroke="#5b3219" stroke-width="5"/><g class="arm-front"><path d="M99 95 Q125 114 138 134" stroke="#e8a060" stroke-width="17" stroke-linecap="round" fill="none"/><circle cx="141" cy="139" r="10" fill="#efae70"/><path d="M140 138 l10 2 m-11 -5 l8 -5" stroke="#efae70" stroke-width="5" stroke-linecap="round"/></g><ellipse cx="88" cy="56" rx="40" ry="44" fill="#e9a366" stroke="#b8743c" stroke-width="2"/><ellipse cx="119" cy="65" rx="13" ry="10" fill="#e9a366"/><ellipse cx="70" cy="64" rx="11" ry="14" fill="#fff"/><ellipse cx="100" cy="64" rx="11" ry="14" fill="#fff"/><circle cx="73" cy="66" r="6" fill="#201912"/><circle cx="103" cy="66" r="6" fill="#201912"/><path d="M79 84 Q91 94 105 83" fill="none" stroke="#7d3525" stroke-width="4" stroke-linecap="round"/><path d="M48 43 Q35 12 68 10 Q96 -2 123 22 Q134 39 122 48 L111 32 L101 45 L89 29 L74 43 L60 32Z" fill="#241b19"/><g class="hair"><path d="M48 35 Q27 24 10 35 Q29 31 39 51 Q19 45 4 56 Q34 53 51 63Z" fill="#2b211d"/><path d="M54 23 Q31 4 13 15 Q33 15 48 38Z" fill="#2b211d"/></g></svg></div><div class="notice" id="notice"></div></section><footer class="bottom"><button id="restart">↻ Қайта бастау</button><span>🌴 Мауглидің математикалық саяхаты</span><button id="melody">🎵 Әуен 1</button><button id="music">♫ Әуен: қосулы</button></footer></main><div class="modal" id="modal"><div class="dialog"><h1 id="heading">🌴 Мауглидің математикалық саяхаты</h1><p id="description">Дұрыс жауапты таңда!</p><button id="start">▶ Ойынды бастау</button></div></div><script>
const tasks=[[3,'+',7],[6,'−',2],[4,'+',5],[10,'−',7],[2,'+',6],[9,'−',4],[1,'+',7],[8,'−',6],[5,'+',5],[7,'−',3],[2,'+',3],[10,'−',8],[6,'+',4],[9,'−',6],[1,'+',9],[7,'−',5],[4,'+',4],[10,'−',1],[3,'+',6],[8,'−',3]];
const $=id=>document.getElementById(id),world=$('world'),hero=$('hero'),track=$('track');let idx=0,started=0,tick=null,busy=false,run=0,audio=null,musicOn=true,musicLoop=null,musicIndex=0,melodyIndex=0,position=0,camera=0;const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');function tone(freq,dur=.2,vol=.2,type='sine',delay=0){if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02)}function yes(){[523,659,784].forEach((n,i)=>tone(n,.22,.22,'sine',i*.13))}function no(){tone(200,.25,.18,'sawtooth');tone(140,.24,.15,'triangle',.15)}function music(){clearInterval(musicLoop);musicLoop=null;if(!musicOn||!audio)return;const songs=[[392,440,523,587,523,440,392,330,349,392,440,523,440,392,349,330],[523,659,784,659,587,523,440,523,587,698,784,698,587,523,440,392],[330,392,440,523,587,523,440,392,349,440,523,659,587,523,440,392]];const notes=songs[melodyIndex];musicLoop=setInterval(()=>tone(notes[musicIndex++%notes.length],.33,.39,'triangle'),365)}function options(n){let choices=[n],others=[...Array(11).keys()].filter(x=>x!==n).sort((a,b)=>Math.abs(a-n)-Math.abs(b-n));while(choices.length<4){choices.push(others.splice(Math.floor(Math.random()*Math.min(5,others.length)),1)[0])}return choices.sort(()=>Math.random()-.5)}function render(){busy=false;$('notice').textContent='';$('progress').innerHTML=`Тапсырма:<br>${idx+1} / 20`;const [a,op,b]=tasks[idx],ans=op==='+'?a+b:a-b;$('expression').textContent=`${a} ${op} ${b} =`;$('answers').replaceChildren(...options(ans).map(v=>{let el=document.createElement('button');el.className='ans';el.textContent=v;el.onclick=()=>choose(el,v,ans);return el}))}
function stumpX(i){return i*34+7}function buildTrack(){track.innerHTML='';for(let i=0;i<24;i++){const s=document.createElement('div');s.className='stump';s.style.left=stumpX(i)+'%';track.appendChild(s)}track.style.transform='translateX(0)'}function heroCoords(i){const w=world.clientWidth,h=world.clientHeight,sw=hero.getBoundingClientRect().width;return{x:w*(stumpX(i)+11-camera)/100-sw*.5,y:Math.max(12,h*.30-sw*.12)}}function putHero(i){let c=heroCoords(i);hero.style.left=c.x+'px';hero.style.bottom=c.y+'px'}function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function choose(button,n,correct){
 if(busy)return;
 if(n!==correct){button.classList.add('no');$('notice').textContent='Қайта ойланып көр!';no();setTimeout(()=>button.classList.remove('no'),400);return}
 busy=true;button.classList.add('ok');$('notice').textContent='Жарайсың!';yes();
 const token=run,from=position,to=from+1;
 const a=heroCoords(from),b=heroCoords(to),dx=b.x-a.x,dy=a.y-b.y,arc=Math.min(110,Math.max(55,world.clientHeight*.17));
 hero.className='hero flying';
 const anim=hero.animate([
 {transform:'translate(0px,0px) rotate(-9deg) scale(.93)',offset:0},
 {transform:`translate(${dx*.24}px,${-arc*.70}px) rotate(-8deg) scale(1.03)`,offset:.26},
 {transform:`translate(${dx*.53}px,${-arc}px) rotate(0deg) scale(1.09)`,offset:.52},
 {transform:`translate(${dx*.81}px,${-arc*.55+dy*.81}px) rotate(8deg) scale(1.01)`,offset:.82},
 {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.91)`,offset:1}
 ],{duration:1550,easing:'ease-in-out',fill:'forwards'});
 try{await anim.finished}catch{return}
 if(run!==token)return;
 anim.cancel();position=to;putHero(to);hero.className='hero landed';
 hero.animate([{transform:'scaleY(.83)'},{transform:'scaleY(1)'}],{duration:260});
 $('notice').textContent='Келесі ағашқа қонды!';
 await wait(350);if(run!==token)return;
 // Үшінші ағаштан кейін жаңа үш ағаш көрінеді: бала бірінші ағашқа ауысады.
 // Әр секірісте басы экранда қалады; тапсырма қонған соң ғана өзгереді.
 if(position===2){
   await wait(250);if(run!==token)return;
   const slide=world.animate([{filter:'brightness(1)'},{filter:'brightness(1.15)'},{filter:'brightness(1)'}],{duration:450});
   await slide.finished.catch(()=>{});if(run!==token)return;
   position=0;camera=0;track.style.transform='translateX(0)';
   hero.className='hero landed';putHero(0);
 }

 idx++;if(idx===tasks.length){finish();return}
 render();
}
function finish(){clearInterval(tick);clearInterval(musicLoop);musicLoop=null;$('heading').textContent='🏆 Жарайсың!';$('description').innerHTML=`20 тапсырманы орындадың!<br>⏱ Уақытың: <b>${fmt(Math.floor((Date.now()-started)/1000))}</b>`;$('start').textContent='↻ Қайта ойнау';$('modal').classList.remove('hidden');yes()}function start(){run++;audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();idx=0;position=0;camera=0;started=Date.now();busy=false;buildTrack();hero.className='hero prep';hero.style.transform='';putHero(0);$('modal').classList.add('hidden');clearInterval(tick);tick=setInterval(()=>$('clock').innerHTML='⏱ Уақыт:<br>'+fmt(Math.floor((Date.now()-started)/1000)),250);music();render()}$('start').onclick=start;$('restart').onclick=()=>{run++;clearInterval(tick);clearInterval(musicLoop);musicLoop=null;$('heading').textContent='🌴 Мауглидің математикалық саяхаты';$('description').innerHTML='Дұрыс жауапты таңда!';$('start').textContent='▶ Ойынды бастау';$('modal').classList.remove('hidden')};$('melody').onclick=()=>{melodyIndex=(melodyIndex+1)%3;musicIndex=0;$('melody').textContent='🎵 Әуен '+(melodyIndex+1);music()};$('music').onclick=()=>{musicOn=!musicOn;$('music').textContent=musicOn?'♫ Әуен: қосулы':'♪ Әуен: өшірулі';music()};window.addEventListener('resize',()=>{if(!busy&&started)putHero(position)});buildTrack();putHero(0);render();
</script></body></html>
